# =============================================================
#  Fichier    : ci.yml
#  Projet     : Kalami
#  Description: Intégration continue — lint, types, tests unitaires et build à chaque push / PR.
#  Auteur     : Claude Marcel
#  Version    : 1.1
#  Date       : 2026-10-07
#  Variables  : NEXT_PUBLIC_SUPABASE_URL et NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY à créer dans
#               GitHub → Settings → Secrets and variables → Actions → Variables (valeurs
#               publiques : le build pré-rend l'accueil, qui lit le catalogue).
# =============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build
